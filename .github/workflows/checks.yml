name: "Code Analysis"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.head_ref) }}
  cancel-in-progress: true

permissions: read-all

jobs:
  Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  Dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify dist/ is up to date
        run: |
          if ! git diff --exit-code dist/; then
            echo "::error::dist/ is out of date — run 'npm run build' and commit the result"
            exit 1
          fi

  Test:
    runs-on: ubuntu-latest
    outputs:
      roas-matrix: ${{ steps.roas.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0

      - name: Checkout roas as a test project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0
        with:
          repository: sv-tools/roas
          path: ./roas
      - id: roas
        uses: ./
        with:
          manifest-path: "./roas/Cargo.toml"
      - run: echo "Packages - ${{ steps.roas.outputs.packages }}"
      - run: echo "To Publish - ${{ steps.roas.outputs.publish }}"
      - run: echo "Matrix - ${{ steps.roas.outputs.matrix }}"

      - name: Should fail
        uses: ./
        continue-on-error: true

  Fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0

      - id: single-public
        uses: ./
        with:
          manifest-path: tests/fixtures/single-public/Cargo.toml
      - name: Verify single-public outputs
        env:
          PACKAGES: ${{ steps.single-public.outputs.packages }}
          PUBLISH: ${{ steps.single-public.outputs.publish }}
          MATRIX: ${{ steps.single-public.outputs.matrix }}
          RUST_VERSION: ${{ steps.single-public.outputs.rust-version }}
          EDITION: ${{ steps.single-public.outputs.edition }}
        run: |
          [ "$PACKAGES" = '["single-public"]' ] || { echo "packages: $PACKAGES"; exit 1; }
          [ "$PUBLISH" = '["single-public"]' ] || { echo "publish: $PUBLISH"; exit 1; }
          [ "$MATRIX" = '["--package=single-public"]' ] || { echo "matrix: $MATRIX"; exit 1; }
          [ "$RUST_VERSION" = '1.85' ] || { echo "rust-version: $RUST_VERSION"; exit 1; }
          [ "$EDITION" = '2021' ] || { echo "edition: $EDITION"; exit 1; }

      - id: single-private
        uses: ./
        with:
          manifest-path: tests/fixtures/single-private/Cargo.toml
      - name: Verify single-private outputs
        env:
          PACKAGES: ${{ steps.single-private.outputs.packages }}
          PUBLISH: ${{ steps.single-private.outputs.publish }}
          MATRIX: ${{ steps.single-private.outputs.matrix }}
          RUST_VERSION: ${{ steps.single-private.outputs.rust-version }}
          EDITION: ${{ steps.single-private.outputs.edition }}
        run: |
          [ "$PACKAGES" = '["single-private"]' ] || { echo "packages: $PACKAGES"; exit 1; }
          [ "$PUBLISH" = '[]' ] || { echo "publish: $PUBLISH"; exit 1; }
          [ "$MATRIX" = '["--package=single-private"]' ] || { echo "matrix: $MATRIX"; exit 1; }
          [ -z "$RUST_VERSION" ] || { echo "rust-version expected empty, got: $RUST_VERSION"; exit 1; }
          [ "$EDITION" = '2021' ] || { echo "edition: $EDITION"; exit 1; }

      - id: workspace-mixed
        uses: ./
        with:
          manifest-path: tests/fixtures/workspace-mixed/Cargo.toml
      - name: Verify workspace-mixed outputs
        env:
          PACKAGES: ${{ steps.workspace-mixed.outputs.packages }}
          PUBLISH: ${{ steps.workspace-mixed.outputs.publish }}
          MATRIX: ${{ steps.workspace-mixed.outputs.matrix }}
          RUST_VERSION: ${{ steps.workspace-mixed.outputs.rust-version }}
          EDITION: ${{ steps.workspace-mixed.outputs.edition }}
        # Compare as sets (sorted) — cargo metadata's package order follows
        # workspace member declaration order, but feature order is alphabetical.
        # Sorting both sides keeps the assertion stable across cargo versions.
        run: |
          jq -ne --argjson got "$PACKAGES" '$got | sort == ["feature-lib","private-lib","rma-fixture-app"]' \
            || { echo "packages: $PACKAGES"; exit 1; }
          jq -ne --argjson got "$PUBLISH" '$got | sort == ["feature-lib","rma-fixture-app"]' \
            || { echo "publish: $PUBLISH"; exit 1; }
          jq -ne --argjson got "$MATRIX" '$got | sort == ["--package=feature-lib --features=bar","--package=feature-lib --features=default","--package=feature-lib --features=foo","--package=private-lib","--package=rma-fixture-app"]' \
            || { echo "matrix: $MATRIX"; exit 1; }
          [ "$RUST_VERSION" = '1.90' ] || { echo "rust-version: $RUST_VERSION"; exit 1; }
          [ "$EDITION" = '2024' ] || { echo "edition: $EDITION"; exit 1; }

      - id: workspace-release
        uses: ./
        with:
          manifest-path: tests/fixtures/workspace-release/Cargo.toml
          matrix-mode: both
          tag: rma-fixture-cli/v1.0.0
      - name: Verify workspace-release outputs
        env:
          PUBLISH: ${{ steps.workspace-release.outputs.publish }}
          WAVES: ${{ steps.workspace-release.outputs.publish-waves }}
          ORDER: ${{ steps.workspace-release.outputs.release-order }}
          NEW: ${{ steps.workspace-release.outputs.new-crates }}
          TAG_PACKAGE: ${{ steps.workspace-release.outputs.tag-package }}
          TAG_VERSION: ${{ steps.workspace-release.outputs.tag-version }}
          LIBS: ${{ steps.workspace-release.outputs.lib-packages }}
          BIN_PACKAGES: ${{ steps.workspace-release.outputs.bin-packages }}
          BINS: ${{ steps.workspace-release.outputs.bins }}
          MATRIX: ${{ steps.workspace-release.outputs.matrix }}
          MATRIX_INCLUDE: ${{ steps.workspace-release.outputs.matrix-include }}
        run: |
          [ "$PUBLISH" = '["rma-fixture-core","rma-fixture-ffi","rma-fixture-cli"]' ] || { echo "publish: $PUBLISH"; exit 1; }
          [ "$WAVES" = '[["rma-fixture-core"],["rma-fixture-ffi"],["rma-fixture-cli"]]' ] || { echo "publish-waves: $WAVES"; exit 1; }
          [ "$ORDER" = '["rma-fixture-core/v0.2.0","rma-fixture-ffi/v0.1.0","rma-fixture-cli/v1.0.0"]' ] || { echo "release-order: $ORDER"; exit 1; }
          [ "$NEW" = "$PUBLISH" ] || { echo "new-crates: $NEW"; exit 1; }
          [ "$TAG_PACKAGE" = 'rma-fixture-cli' ] || { echo "tag-package: $TAG_PACKAGE"; exit 1; }
          [ "$TAG_VERSION" = '1.0.0' ] || { echo "tag-version: $TAG_VERSION"; exit 1; }
          [ "$LIBS" = '["rma-fixture-core","rma-fixture-ffi"]' ] || { echo "lib-packages: $LIBS"; exit 1; }
          [ "$BIN_PACKAGES" = '["rma-fixture-cli","rma-fixture-tool"]' ] || { echo "bin-packages: $BIN_PACKAGES"; exit 1; }
          [ "$BINS" = '[{"package":"rma-fixture-cli","bin":"rma-cli"}]' ] || { echo "bins: $BINS"; exit 1; }
          jq -ne --argjson got "$MATRIX" '$got | index("--package=rma-fixture-core --no-default-features --features=extra") != null' \
            || { echo "matrix: $MATRIX"; exit 1; }
          jq -ne --argjson got "$MATRIX_INCLUDE" '[$got[] | select(.package == "rma-fixture-cli")] | all(.lib == false and .bins == ["rma-cli"])' \
            || { echo "matrix-include: $MATRIX_INCLUDE"; exit 1; }

      - id: tag-mismatch
        uses: ./
        continue-on-error: true
        with:
          manifest-path: tests/fixtures/workspace-release/Cargo.toml
          tag: rma-fixture-cli/v1.0.1
      - id: tag-disabled
        uses: ./
        with:
          manifest-path: tests/fixtures/workspace-release/Cargo.toml
          tag: none
      - name: Verify tag none skips tag handling
        env:
          TAG_PACKAGE: ${{ steps.tag-disabled.outputs.tag-package }}
        run: '[ -z "$TAG_PACKAGE" ] || { echo "tag-package: $TAG_PACKAGE"; exit 1; }'

      - name: Verify tag mismatch failed
        if: steps.tag-mismatch.outcome != 'failure'
        run: |
          echo "::error::expected the action to fail on a tag/Cargo.toml version mismatch"
          exit 1

      - id: toolchain-pinned
        uses: ./
        with:
          manifest-path: tests/fixtures/toolchain-pinned/Cargo.toml
      - name: Verify toolchain-pinned outputs
        env:
          PACKAGES: ${{ steps.toolchain-pinned.outputs.packages }}
          RUST_VERSION: ${{ steps.toolchain-pinned.outputs.rust-version }}
          EDITION: ${{ steps.toolchain-pinned.outputs.edition }}
        run: |
          [ "$PACKAGES" = '["toolchain-pinned"]' ] || { echo "packages: $PACKAGES"; exit 1; }
          [ -z "$RUST_VERSION" ] || { echo "rust-version expected empty, got: $RUST_VERSION"; exit 1; }
          [ "$EDITION" = '2021' ] || { echo "edition: $EDITION"; exit 1; }
      - name: Verify pinned toolchain was actually installed
        # Confirms ensureToolchain ran end-to-end. If a future regression
        # silently skipped the install, this grep would fail.
        run: rustup toolchain list | grep -E '^1\.85\.0'

  Roas:
    runs-on: ubuntu-latest
    needs: Test
    strategy:
      matrix:
        args: ${{ fromJson(needs.Test.outputs.roas-matrix) }}
    steps:
      - name: Checkout roas as a test project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.5.0
        with:
          repository: sv-tools/roas
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          rustflags: ""
      - name: Run tests
        run: cargo test ${{ matrix.args }} --no-default-features --no-fail-fast --verbose
